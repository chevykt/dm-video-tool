[pytest]
# pydub/utils.py (third-party, not ours to edit) uses unescaped "\(" in a
# handful of regex string literals, which Python 3.14's compiler flags with
# a SyntaxWarning the first time that file is compiled (e.g. after a fresh
# checkout or venv, before .pyc caching hides it). A `module` filter can't
# scope this out -- compile-time SyntaxWarnings are attributed to whatever
# is doing the importing, not to pydub.utils itself -- so this is scoped as
# narrowly as the mechanism allows: SyntaxWarning + the exact message pydub
# emits for its invalid escape sequences, nothing broader.
filterwarnings =
    ignore:.*invalid escape sequence.*:SyntaxWarning
