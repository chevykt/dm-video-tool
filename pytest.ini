[pytest]
# pydub/utils.py (third-party, not ours to edit) uses unescaped "\(" in a
# handful of regex string literals, which Python 3.14's compiler flags with
# a SyntaxWarning the first time that file is compiled (e.g. after a fresh
# checkout or venv, before .pyc caching hides it). Scoped to pydub's own
# file via the `module` field (matched as a regex against the warning's
# filename, so it needs `.*` around "pydub" to match the absolute path)
# plus the exact message pydub emits for its invalid escape sequences, so
# an accidental non-raw regex in our own code would still be reported.
filterwarnings =
    ignore:.*invalid escape sequence.*:SyntaxWarning:.*pydub.*
